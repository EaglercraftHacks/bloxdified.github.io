<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxdified
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo-section">
                <div class="logo">BLOXDIFIED</div>
                <a href="https://www.youtube.com/@bloxdified" target="_blank" class="subscribe-btn">
                    <span>▶</span> Subscribe
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#textures">Texture Packs</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Welcome to Bloxdified</h1>
            <button class="cta-button">Get Started</button>
        </div>
    </section>

    <section id="textures" class="texture-packs">
        <div class="container">
            <h2>Top 3 Texture Packs</h2>
            <p>Explore the best texture packs for Bloxd.io</p>
            
            <div class="packs-scroll">
                <div class="pack-card">
                    <div class="pack-image">
                        <img src="https://via.placeholder.com/300x200?text=Astray" alt="Astray">
                    </div>
                    <h3>Astray</h3>
                    <p>Experience the original Astray texture pack with stunning visuals</p>
                    <a href="https://www.mediafire.com/download/astray" target="_blank" class="download-btn">Download</a>
                    <p class="credit">By Bloxdman</p>
                </div>

                <div class="pack-card">
                    <div class="pack-image">
                        <img src="https://via.placeholder.com/300x200?text=Relonix" alt="Relonix">
                    </div>
                    <h3>Relonix</h3>
                    <p>High-quality modern textures with enhanced lighting effects</p>
                    <a href="https://www.mediafire.com/download/relonix" target="_blank" class="download-btn">Download</a>
                    <p class="credit">By Bloxdman</p>
                </div>

                <div class="pack-card">
                    <div class="pack-image">
                        <img src="https://via.placeholder.com/300x200?text=Xray" alt="Xray">
                    </div>
                    <h3>Xray</h3>
                    <p>Enhanced visibility with X-Ray effects for better gameplay</p>
                    <a href="https://www.mediafire.com/download/xray" target="_blank" class="download-btn">Download</a>
                    <p class="credit">By Bloxdman</p>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="container">
            <h2>About Bloxdified</h2>
            <p>Bloxdified is dedicated to improving bloxd.io and bringing the community together. a</p>
            <div class="features">
                <div class="feature-card">
                    <h3> Chatting</h3>
                    <p>Connect with the community</p>
                </div>
                <div class="feature-card">
                    <h3>Teir testing</h3>
                    <p>Test your current skills</p>
                </div>
                <div class="feature-card">
                    <h3>Find what fits</h3>
                    <p>Find the texture pack you want to improve your gameplay</p>
                </div>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>Get In Touch</h2>
            <p>Have questions or want to collaborate? Reach out!</p>
            <a href="mailto:contact@bloxdified.com" class="contact-button">Email Us</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Bloxdified. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
